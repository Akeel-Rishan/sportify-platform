openapi: 3.1.0
info:
  title: SPORTIFY API
  version: 1.0.0
  description: Versioned REST API for the SPORTIFY multi-tenant indoor sports booking SaaS. This contract covers
    MVP endpoints only. Tenant context is resolved server-side; public tenant website routes resolve the verified
    Host header. Public ID migration and permission-code additions described in the companion Markdown are release
    blockers.
servers:
- url: https://api.sportify.lk/api/v1
  description: Production (proposed hostname; confirm DNS before release)
- url: https://staging-api.sportify.lk/api/v1
  description: Staging (proposed hostname; provision separately)
tags:
- name: System
- name: Authentication
- name: Public Website
- name: Business
- name: Onboarding
- name: Sports
- name: Locations
- name: Resources
- name: Schedules
- name: Availability
- name: Bookings
- name: Customers
- name: Payments
- name: Staff
- name: Website
- name: Reports
- name: Subscriptions
- name: Super Admin

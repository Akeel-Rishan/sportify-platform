components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sportify_session
      description: Server-side session cookie; Secure, HttpOnly and SameSite=Lax.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on state-changing requests authenticated by the session cookie.
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
      additionalProperties: false
      required:
      - reason
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        requestId:
          type: string
      additionalProperties: false
      required:
      - success
      - error
      - requestId
      description: Standard API error envelope. Internal database messages and stack traces are never returned.
    ActionResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
          - ACCEPTED
          - REVOKED
          - DEACTIVATED
          - PUBLISHED
          - VERIFIED
          - RESET
          - SENT
          - RELEASED
          - CANCELLED
          - SUSPENDED
          - REACTIVATED
        message:
          type: string
      additionalProperties: false
      required:
      - status
    Money:
      type: object
      properties:
        amount:
          type: string
          pattern: ^\d{1,10}(\.\d{1,2})?$
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currencyCode
      additionalProperties: false
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - page
      - pageSize
      - total
    SystemStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
          - not_ready
        service:
          type: string
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - status
      - service
      - timestamp
    CsrfResult:
      type: object
      properties:
        csrfToken:
          type: string
        expiresAtUtc:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - csrfToken
      - expiresAtUtc
    Address:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
      additionalProperties: false
      required:
      - addressLine1
      - city
      - countryCode
    RegistrationRequest:
      type: object
      properties:
        businessName:
          type: string
          maxLength: 200
        ownerName:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        mobile:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          maxLength: 16
        password:
          type: string
          minLength: 12
          maxLength: 128
        businessLocation:
          $ref: '#/components/schemas/Address'
        primarySportCode:
          type: string
          maxLength: 50
      additionalProperties: false
      required:
      - businessName
      - ownerName
      - email
      - mobile
      - password
      - businessLocation
      - primarySportCode
    RegistrationResult:
      type: object
      properties:
        registrationStatus:
          type: string
          enum:
          - PENDING_EMAIL_VERIFICATION
        emailMasked:
          type: string
        tenantPublicId:
          type: string
          format: uuid
        nextStep:
          type: string
          enum:
          - VERIFY_EMAIL
      additionalProperties: false
      required:
      - registrationStatus
      - emailMasked
      - tenantPublicId
      - nextStep
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
      required:
      - email
      - password
    UserSummary:
      type: object
      properties:
        userPublicId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        accountStatus:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - LOCKED
          - DISABLED
      additionalProperties: false
      required:
      - userPublicId
      - fullName
      - accountStatus
    MembershipSummary:
      type: object
      properties:
        tenantPublicId:
          type: string
          format: uuid
        tenantName:
          type: string
        membershipStatus:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - SUSPENDED
          - REVOKED
        roleCodes:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        branchIds:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false
      required:
      - tenantPublicId
      - tenantName
      - membershipStatus
      - roleCodes
      - permissions
      - branchIds
    LoginResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'

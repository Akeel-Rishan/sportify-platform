                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/SystemStatus'
                  requestId:
                    type: string
                required:
                - success
                - data
                - requestId
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
